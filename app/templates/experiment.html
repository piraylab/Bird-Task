  //------------------------------------//
  // A function for creating main trial sequences
  //------------------------------------//
  var make_trials = function(practice_no, randomized) {
    // var num_trials = 10;

    var is_moving_practice = false;
    var show_missing = false;
    var num_birds = 1;
    var show_bird = true;
    var bird_trial = false;
    var missed_threshold = 3;
    var num_trials = 10;
    var bag_position = practice_bag_position;
    var bird_position = practice_bird_position;


    var warning_threshold = 16;
    var strong_warning = false;

    if (practice_no==1) {
        is_moving_practice = true;
        show_missing = true;
        show_bird = false;
        missed_threshold = 10; // effectively no missed_threshold here
        num_trials = 1;

        randomized = [0];

    } else if (practice_no==2) {
        num_trials = 6;
        missed_threshold = 2;
        randomized = [0];

    } else if (practice_no==3) {
        num_trials = 6;
        missed_threshold = 2;
        randomized = [0];

    } else if (practice_no==4) {
        show_bird = false;
        randomized = [0];

    } else if (practice_no==0) {
        num_birds = 4;
        show_bird = false;
        bird_trial = true;
        missed_threshold = 20;
        warning_threshold = 16;
        num_trials = 50;
        bag_position = main_bag_position;
        bird_position = main_bird_position
    };

    var stayed_threshold = 4;
    birds = ["../static/img/bird1.png","../static/img/bird2.png","../static/img/bird3.png","../static/img/bird4.png"];

    // Iteratively define trials.
    var trials = [];
    var missed_responses = 0;
    var k = 0;
    var bucket = 0;
    var stayed = 0;
    for (var j = 0; j < num_birds; j++) {
      var bird_trial1 = {
          type: 'image-keyboard-response',
          prompt: '<p>A new bird and wind condition! Press arrow keys or the space bar to begin (we proceed automatically in 20 seconds)</p>',
          choices: [32, 37, 39],
          trial_duration: 20000,
          timeline: [
              {stimulus: birds[randomized[j]]},
          ]
      };
      var bird_trial2 = {
          type: 'image-keyboard-response',
          prompt: '<p> Beginning...</p>',
          choices: jsPsych.NO_KEYS,
          trial_duration: 3000,
          timeline: [
              {stimulus: birds[randomized[j]]},
          ]
      };

      if (bird_trial) {
          trials.push(bird_trial1);
          trials.push(bird_trial2);
      }

      bucket = 50;

      for (i = 0; i < num_trials; i++) {
        k = k+1;

        // Define trial-test
        const trial_te = {
          type: 'trial',
          data: {block: j+1, randomized: randomized[j], trial: i+1, },
          coins_duration: coins_duration[k],
          coins_distribution: coins_distribution[k],
          bag_position: bag_position[randomized[j]][i],
          bird_position: bird_position[randomized[j]][i],
          show_bird: show_bird,
          is_moving_practice: is_moving_practice,
          missing_msg_warning_number: warning_threshold,
          on_start: function(trial) {
            trial.bucket_position = bucket;
            trial.show_missing = show_missing;
            trial.strong_warning = strong_warning;
          },
          on_finish: function(data) {
            var dat = jsPsych.data.getLastTrialData().values()[0];
            bucket = dat.bucket_position;
            if (dat.trial == num_trials ) {
              bucket = 50;
            };
            stayed = stayed + dat.stayed;
            show_missing = false;

            // Evaluate missing data
            if ( stayed == stayed_threshold ) {
              stayed = 0;
              show_missing = true;

              missed_responses = missed_responses+1;
              if (missed_responses >= warning_threshold) {
                strong_warning = true;
              }

              if (missed_responses >= missed_threshold) {
                low_quality = true;
                jsPsych.endExperiment();
              }
            };
          }
        };

        // Define looping node.
        const trial_node = {
          timeline: [trial_te],
          loop_function: function(data) {
            return data.values()[0].missing;
          },
        };

        // Push trial.
        trials.push(trial_node);
      }
    }
    return trials;
  }; // make_trials
